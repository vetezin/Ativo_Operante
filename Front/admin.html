<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Administrador</title>
    <link rel="stylesheet" href="style.css">

    <script>
    // Proteção de acesso
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    // Se não estiver logado ou não for admin, redireciona para o login
    if (!token || (role !== "ADMIN" && role !== "1")) {
        alert("Acesso não autorizado. Faça login como administrador.");
        window.location.href = "login.html";
    }
</script>
</head>
<body>
    
    <div class="container">
        <h1>Área do Administrador</h1>

        <!-- CRUD Órgãos -->
        <section class="admin-section">
            <h2>Órgãos Cadastrados</h2>
            <ul id="orgaoLista" class="item-list">
                
            </ul>
            <button onclick="mostrarFormularioOrgao()">+ Adicionar Novo Órgão</button>

            <!-- Formulário oculto para adicionar/editar órgão -->
            <form id="orgaoForm" class="admin-form" style="display: none;">
                <input type="text" id="orgaoNome" placeholder="Nome do órgão" required>
                <input type="hidden" id="orgaoId">
                <button type="submit">Salvar Órgão</button>
            </form>
        </section>

        <!-- CRUD Tipos de Problemas -->
        <section class="admin-section">
            <h2>Tipos de Problemas</h2>
            <ul id="problemaLista" class="item-list">
                <!-- Populado via JS -->
            </ul>
            <button onclick="mostrarFormularioProblema()">+ Adicionar Novo Tipo</button>

            <!-- Formulário oculto para adicionar/editar tipo de problema -->
            <form id="problemaForm" class="admin-form" style="display: none;">
                <input type="text" id="problemaNome" placeholder="Tipo de problema" required>
                <input type="hidden" id="problemaId">
                <button type="submit">Salvar Tipo</button>
            </form>
        </section>

        <!-- Denúncias -->
        <section class="admin-section">
            <h2>Denúncias Recebidas</h2>
            <ul id="denunciasLista" class="item-list">
                
        </section>
    </div>
    

    <script src="admin.js"></script>
</body>
</html>
